<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>100 Argentinos Dicen — Juventud Dor Jadash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFFFFF;
    --bg-soft:#F6F8FB;
    --navy:#152B52;
    --blue:#2F5C99;
    --blue-soft:#EAF1FB;
    --blue-softer:#F2F6FC;
    --gold:#C6A15B;
    --text:#1E2733;
    --muted:#7A8496;
    --border:#E7ECF3;
    --red:#C0432F;

    --t1:#7A4FA3; --t1-soft:#F1E9F8;
    --t2:#D9782E; --t2-soft:#FCEEE1;
    --t3:#2F6FB0; --t3-soft:#E9F1FB;
    --t4:#2F9E5C; --t4-soft:#E8F7ED;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  /* ===== NAVBAR ===== */
  .navbar{
    position:sticky;
    top:0;
    z-index:50;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 28px;
    background:rgba(255,255,255,0.92);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
  }
  .nav-brand{ display:flex; align-items:center; gap:12px; }
  .nav-brand img{
    width:42px; height:42px; border-radius:50%; object-fit:cover;
    box-shadow:0 0 0 2px var(--blue-soft);
  }
  .nav-brand .name{ display:flex; flex-direction:column; line-height:1.15; }
  .nav-brand .name .top{
    font-family:'Fraunces',serif; font-size:15px; font-weight:600; color:var(--navy);
  }
  .nav-brand .name .bottom{
    font-size:10.5px; letter-spacing:.14em; color:var(--muted); text-transform:uppercase;
  }
  .nav-tag{
    font-size:12px; color:var(--blue); background:var(--blue-soft);
    padding:6px 14px; border-radius:999px; font-weight:600; white-space:nowrap;
  }

  /* ===== HERO ===== */
  .hero{
    text-align:center;
    padding:64px 20px 40px;
    background:radial-gradient(ellipse 700px 320px at 50% 0%, var(--blue-softer), transparent 70%);
  }
  .eyebrow{
    font-size:12.5px; letter-spacing:.24em; color:var(--gold); font-weight:700;
    text-transform:uppercase; margin:0 0 18px;
  }
  h1.title{
    font-family:'Fraunces',serif; font-weight:600;
    font-size:clamp(36px, 6vw, 60px); line-height:1.04; margin:0; color:var(--navy);
    letter-spacing:-.01em;
  }
  h1.title em{ font-style:italic; color:var(--blue); }
  .subtitle{
    margin:20px auto 0; max-width:520px; font-size:15px; color:var(--muted); line-height:1.6;
  }
  .divider{ width:56px; height:2px; background:var(--gold); margin:26px auto 0; border-radius:2px; }

  /* ===== SCOREBOARD ===== */
  .scoreboard{
    max-width:920px;
    margin:0 auto;
    padding:0 18px 8px;
  }
  .scoreboard-head{
    display:flex; align-items:baseline; justify-content:space-between; margin-bottom:14px; flex-wrap:wrap; gap:8px;
  }
  .scoreboard-title{
    font-family:'Fraunces',serif; font-size:18px; font-weight:600; color:var(--navy);
  }
  .scoreboard-sub{ font-size:12.5px; color:var(--muted); }
  .reset-scores{
    font-size:12px; color:var(--muted); background:none; border:1px solid var(--border);
    padding:7px 14px; border-radius:999px; cursor:pointer; font-weight:600;
  }
  .reset-scores:hover{ border-color:var(--red); color:var(--red); }

  .teams-grid{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:12px;
    margin-bottom:8px;
  }
  .team-card{
    position:relative;
    background:#fff;
    border:1.5px solid var(--border);
    border-radius:16px;
    padding:16px 12px 14px;
    text-align:center;
    cursor:pointer;
    transition:all .18s ease;
  }
  .team-card:hover{ transform:translateY(-2px); }
  .team-card .crown{
    position:absolute; top:-11px; left:50%; transform:translateX(-50%);
    font-size:16px; opacity:0; transition:opacity .2s ease;
  }
  .team-card.leader .crown{ opacity:1; }
  .team-card .dot{
    width:10px; height:10px; border-radius:50%; margin:0 auto 8px;
  }
  .team-card .tname{
    font-weight:700; font-size:13px; color:var(--navy); margin-bottom:6px;
    letter-spacing:.01em;
  }
  .team-card .tscore{
    font-family:'Fraunces',serif; font-weight:700; font-size:26px; color:var(--navy);
  }
  .team-card .tstatus{
    font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted);
    margin-top:4px; font-weight:600; height:12px;
  }

  .team-card[data-team="0"].active{ border-color:var(--t1); background:var(--t1-soft); }
  .team-card[data-team="0"] .dot{ background:var(--t1); }
  .team-card[data-team="0"].active .tstatus{ color:var(--t1); }

  .team-card[data-team="1"].active{ border-color:var(--t2); background:var(--t2-soft); }
  .team-card[data-team="1"] .dot{ background:var(--t2); }
  .team-card[data-team="1"].active .tstatus{ color:var(--t2); }

  .team-card[data-team="2"].active{ border-color:var(--t3); background:var(--t3-soft); }
  .team-card[data-team="2"] .dot{ background:var(--t3); }
  .team-card[data-team="2"].active .tstatus{ color:var(--t3); }

  .team-card[data-team="3"].active{ border-color:var(--t4); background:var(--t4-soft); }
  .team-card[data-team="3"] .dot{ background:var(--t4); }
  .team-card[data-team="3"].active .tstatus{ color:var(--t4); }

  .top-actions{
    display:flex; justify-content:center; gap:12px; margin-top:26px; flex-wrap:wrap;
  }
  .btn{
    font-family:'Inter',sans-serif; font-weight:600; font-size:13.5px;
    background:var(--navy); color:#fff; border:1px solid var(--navy);
    padding:12px 24px; border-radius:999px; cursor:pointer; transition:all .18s ease;
  }
  .btn:hover{ background:var(--blue); border-color:var(--blue); }
  .btn.secondary{ background:transparent; color:var(--navy); border:1px solid var(--border); }
  .btn.secondary:hover{ border-color:var(--blue); color:var(--blue); background:var(--blue-softer); }

  /* ===== BOARD LIST ===== */
  .board-wrap{ max-width:820px; margin:0 auto; padding:26px 18px 90px; }
  .question-card{
    background:#fff; border:1px solid var(--border); border-radius:18px;
    padding:26px 24px 24px; margin-bottom:22px; box-shadow:0 1px 2px rgba(21,43,82,.03);
    transition:box-shadow .2s ease;
  }
  .question-card:hover{ box-shadow:0 8px 24px rgba(21,43,82,.06); }

  .q-top-row{
    display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; flex-wrap:wrap; gap:10px;
  }
  .q-number{
    font-size:11.5px; color:var(--blue); background:var(--blue-soft);
    padding:4px 12px; border-radius:999px; font-weight:700; letter-spacing:.08em;
  }
  .strikes{
    display:flex; align-items:center; gap:8px;
  }
  .strikes .label{ font-size:10.5px; color:var(--muted); letter-spacing:.08em; text-transform:uppercase; font-weight:700; }
  .strike-dot{
    width:22px; height:22px; border-radius:50%; border:1.5px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    font-family:'Fraunces',serif; font-weight:700; font-size:13px; color:transparent;
    transition:all .2s ease;
  }
  .strike-dot.on{
    background:var(--red); border-color:var(--red); color:#fff;
  }
  .strike-btn{
    font-size:11px; font-weight:700; color:var(--red); background:#FCEDEA;
    border:1px solid #F2D3CC; padding:5px 11px; border-radius:999px; cursor:pointer;
  }
  .strike-btn:hover{ background:#F9DFD8; }
  .strike-reset{
    font-size:11px; color:var(--muted); background:none; border:none; cursor:pointer; text-decoration:underline;
  }

  .q-text{
    font-family:'Fraunces',serif; font-size:19.5px; font-weight:500; line-height:1.42;
    margin:0 0 20px; color:var(--navy);
  }
  .q-text b{ color:var(--blue); font-weight:600; }

  .tiles{
    display:grid; grid-template-columns:repeat(auto-fit, minmax(140px,1fr)); gap:10px; margin-bottom:16px;
  }
  .tile{ perspective:900px; height:92px; cursor:pointer; }
  .tile-inner{
    position:relative; width:100%; height:100%; transform-style:preserve-3d;
    transition:transform .5s cubic-bezier(.2,.8,.3,1);
  }
  .tile.flipped .tile-inner{ transform:rotateY(180deg); }
  .tile-face{
    position:absolute; inset:0; border-radius:12px; display:flex; flex-direction:column;
    align-items:center; justify-content:center; backface-visibility:hidden; padding:8px; text-align:center;
  }
  .tile-front{ background:var(--bg-soft); border:1px solid var(--border); }
  .tile-front:hover{ border-color:var(--blue); }
  .tile-front .rank{ font-family:'Fraunces',serif; font-weight:600; font-size:26px; color:var(--navy); }
  .tile-front .hint{ font-size:9.5px; letter-spacing:.12em; color:var(--muted); margin-top:3px; text-transform:uppercase; }
  .tile-back{
    background:var(--blue-soft); border:1.5px solid #D7E4F7; transform:rotateY(180deg);
  }
  .tile-back .answer{ font-weight:600; font-size:12.5px; color:var(--navy); line-height:1.3; }
  .tile-back .pct{
    font-family:'Fraunces',serif; font-weight:600; font-size:18px; color:#fff;
    background:var(--blue); padding:1px 11px; border-radius:999px; margin-top:6px;
  }
  .tile-back .won-tag{
    font-size:9px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
    margin-top:5px; padding:1px 8px; border-radius:999px; color:#fff;
  }

  .tile.scored-0 .tile-back{ background:var(--t1-soft); border-color:var(--t1); }
  .tile.scored-0 .tile-back .pct{ background:var(--t1); }
  .tile.scored-0 .tile-back .won-tag{ background:var(--t1); }

  .tile.scored-1 .tile-back{ background:var(--t2-soft); border-color:var(--t2); }
  .tile.scored-1 .tile-back .pct{ background:var(--t2); }
  .tile.scored-1 .tile-back .won-tag{ background:var(--t2); }

  .tile.scored-2 .tile-back{ background:var(--t3-soft); border-color:var(--t3); }
  .tile.scored-2 .tile-back .pct{ background:var(--t3); }
  .tile.scored-2 .tile-back .won-tag{ background:var(--t3); }

  .tile.scored-3 .tile-back{ background:var(--t4-soft); border-color:var(--t4); }
  .tile.scored-3 .tile-back .pct{ background:var(--t4); }
  .tile.scored-3 .tile-back .won-tag{ background:var(--t4); }

  .progress-row{ display:flex; align-items:center; gap:12px; }
  .progress-label{
    font-size:10.5px; letter-spacing:.1em; color:var(--muted); white-space:nowrap; font-weight:700; text-transform:uppercase;
  }
  .progress-bar{
    flex:1; height:8px; background:var(--bg-soft); border-radius:999px; overflow:hidden; border:1px solid var(--border);
  }
  .progress-fill{ height:100%; width:0%; background:linear-gradient(90deg, var(--gold), var(--blue)); transition:width .5s ease; }
  .progress-total{ font-family:'Fraunces',serif; font-weight:600; font-size:14px; color:var(--navy); width:38px; text-align:right; }

  footer{
    text-align:center; padding:34px 16px 56px; color:var(--muted); font-size:12px;
    letter-spacing:.04em; border-top:1px solid var(--border);
  }

  @media (prefers-reduced-motion: reduce){ .tile-inner{ transition:none; } }

  @media (max-width:640px){
    .teams-grid{ grid-template-columns:repeat(2, 1fr); }
  }
  @media (max-width:520px){
    .navbar{ padding:10px 16px; }
    .nav-tag{ display:none; }
    .hero{ padding:48px 16px 34px; }
    .q-top-row{ flex-direction:column; align-items:flex-start; }
  }
</style>
</head>

<div class="hero">
  <p class="eyebrow">TORTIM RAMAH SÁBADO 29 DE AGOSTO</p>
  <h1 class="title">100 Argentinos<br><em>Dicen</em></h1>
  <div class="divider"></div>
</div>

<div class="scoreboard">
  <div class="scoreboard-head">
    <div>
      <div class="scoreboard-title">Marcador</div>
      <div class="scoreboard-sub">Tocá un equipo para marcarlo como "en juego"</div>
    </div>
    <button class="reset-scores" onclick="resetScores()">Reiniciar puntajes</button>
  </div>
  <div class="teams-grid" id="teamsGrid"></div>
  <div class="top-actions">
    <button class="btn secondary" onclick="revealAllReview()">Revisar todo (sin sumar puntos)</button>
    <button class="btn secondary" onclick="hideAll()">Tapar todo</button>
  </div>
</div>

<div class="board-wrap" id="board"></div>

<footer>Juventud Dor Jadash +100 · Templo de Murillo</footer>

<script>
const TEAMS = [
  { name: "Letamid",    score: 0 },
  { name: "Kesharim",   score: 0 },
  { name: "Nefesh",     score: 0 },
  { name: "Mebulganim", score: 0 }
];
let activeTeam = 0;

const DATA = [
  {
    q: "Si <b>Judke</b> fuera un animal que podría manejar un auto, ¿qué animal sería?",
    opts: [
      ["Perro", 32],
      ["Mono", 24],
      ["Elefante", 20],
      ["Loro", 14],
      ["Gato", 10]
    ]
  },
  {
    q: "Si <b>Shirwi</b> fuera un objeto que encontrás misteriosamente abajo de tu cama, ¿qué sería?",
    opts: [
      ["Una media", 30],
      ["Un juguete", 24],
      ["Un libro", 20],
      ["Una pelota", 16],
      ["Un cargador", 10]
    ]
  },
  {
    q: "Si <b>Elian</b> fuera un producto de supermercado, ¿qué producto sería?",
    opts: [
      ["Un alfajor", 32],
      ["Una gaseosa", 24],
      ["Galletitas", 20],
      ["Un yogur", 14],
      ["Chocolate", 10]
    ]
  },
  {
    q: "Si <b>Lari T</b> fuera un sabor de helado que todavía no existe, ¿qué sabor sería?",
    opts: [
      ["Dulce de leche con banana", 30],
      ["Chocolate con menta", 26],
      ["Frutilla con crema", 20],
      ["Limón con merengue", 14],
      ["Mate cocido", 10]
    ]
  },
  {
    q: "Si <b>Mica</b> fuera un objeto que llevarías al apocalipsis sin saber por qué, ¿qué sería?",
    opts: [
      ["Una linterna", 28],
      ["Una manta", 24],
      ["Una mochila", 20],
      ["Un espejo", 16],
      ["Un paraguas", 12]
    ]
  },
  {
    q: "Si <b>Tati</b> fuera un electrodoméstico, ¿cuál sería?",
    opts: [
      ["Una heladera", 30],
      ["Un microondas", 24],
      ["Una licuadora", 20],
      ["Un ventilador", 16],
      ["Una plancha", 10]
    ]
  },
  {
    q: "Si <b>Nico</b> fuera un animal con una profesión, ¿qué animal y qué profesión sería?",
    opts: [
      ["Perro policía", 30],
      ["Gato veterinario", 24],
      ["León maestro", 20],
      ["Mono cocinero", 16],
      ["Loro periodista", 10]
    ]
  },
  {
    q: "Si <b>Giane</b> fuera algo que puede caerte del cielo, ¿qué sería?",
    opts: [
      ["Lluvia", 30],
      ["Una estrella fugaz", 22],
      ["Una hoja", 20],
      ["Una pelota", 16],
      ["Una nube", 12]
    ]
  },
  {
    q: "Si <b>Lari S</b> fuera un ruido, ¿qué ruido sería?",
    opts: [
      ["Una risa", 28],
      ["Un aplauso", 24],
      ["Una campana", 20],
      ["Un bostezo", 16],
      ["Un portazo", 12]
    ]
  },
  {
    q: "Si <b>Juli</b> fuera algo que encontrás adentro de una piñata, ¿qué sería?",
    opts: [
      ["Caramelos", 28],
      ["Confeti", 24],
      ["Un juguete", 20],
      ["Una sorpresa", 16],
      ["Chicles", 12]
    ]
  },
  {
    q: "Si <b>Marto</b> fuera un objeto completamente innecesario para llevar a una isla desierta, ¿qué sería?",
    opts: [
      ["Un control remoto", 30],
      ["Una plancha", 24],
      ["Un paraguas", 20],
      ["Una calculadora", 16],
      ["Un secador de pelo", 10]
    ]
  },
  {
    q: "Si <b>Shirju</b> fuera algo que podría salir de una máquina expendedora, ¿qué sería?",
    opts: [
      ["Una gaseosa", 28],
      ["Un chicle", 24],
      ["Un chocolate", 20],
      ["Un llavero", 16],
      ["Una figurita", 12]
    ]
  },
  {
    q: "Si <b>Gonzi</b> fuera una comida que cobró vida, ¿qué comida sería?",
    opts: [
      ["Una milanesa", 30],
      ["Un choripán", 24],
      ["Una empanada", 20],
      ["Un alfajor", 16],
      ["Una pizza", 10]
    ]
  }
];

const teamsGrid = document.getElementById('teamsGrid');
const board = document.getElementById('board');

function renderTeams() {
  teamsGrid.innerHTML = '';
  const maxScore = Math.max(...TEAMS.map(t => t.score));
  TEAMS.forEach((team, ti) => {
    const card = document.createElement('div');
    card.className = 'team-card' + (ti === activeTeam ? ' active' : '') + (team.score > 0 && team.score === maxScore ? ' leader' : '');
    card.dataset.team = ti;
    card.innerHTML = `
      <div class="crown">&#128081;</div>
      <div class="dot"></div>
      <div class="tname">${team.name}</div>
      <div class="tscore">${team.score}</div>
      <div class="tstatus">${ti === activeTeam ? 'En juego' : ''}</div>
    `;
    card.addEventListener('click', () => {
      activeTeam = ti;
      renderTeams();
    });
    teamsGrid.appendChild(card);
  });
}
renderTeams();

function resetScores() {
  TEAMS.forEach(t => t.score = 0);
  document.querySelectorAll('.tile').forEach(t => {
    t.classList.remove('flipped');
    t.classList.remove('scored-0','scored-1','scored-2','scored-3');
    t.dataset.scored = "";
    const tag = t.querySelector('.won-tag');
    if (tag) tag.remove();
  });
  document.querySelectorAll('.strike-dot').forEach(d => d.classList.remove('on'));
  DATA.forEach((_, qi) => updateProgress(qi));
  renderTeams();
}

DATA.forEach((item, qi) => {
  const card = document.createElement('div');
  card.className = 'question-card';

  const topRow = document.createElement('div');
  topRow.className = 'q-top-row';
  topRow.innerHTML = `
    <span class="q-number">Pregunta ${qi+1} / ${DATA.length}</span>
    <div class="strikes">
      <span class="label">Cruces</span>
      <div class="strike-dot" id="strike-${qi}-0"></div>
      <div class="strike-dot" id="strike-${qi}-1"></div>
      <div class="strike-dot" id="strike-${qi}-2"></div>
      <button class="strike-btn" onclick="addStrike(${qi})">Marcar fallo</button>
      <button class="strike-reset" onclick="resetStrikes(${qi})">reiniciar</button>
    </div>
  `;
  card.appendChild(topRow);

  const qText = document.createElement('p');
  qText.className = 'q-text';
  qText.innerHTML = item.q;
  card.appendChild(qText);

  const tiles = document.createElement('div');
  tiles.className = 'tiles';

  item.opts.forEach((opt, oi) => {
    const tile = document.createElement('div');
    tile.className = 'tile';
    tile.dataset.pct = opt[1];
    tile.dataset.q = qi;
    tile.dataset.scored = "";

    tile.innerHTML = `
      <div class="tile-inner">
        <div class="tile-face tile-front">
          <div class="rank">${oi+1}</div>
          <div class="hint">Tocá para ver</div>
        </div>
        <div class="tile-face tile-back">
          <div class="answer">${opt[0]}</div>
          <div class="pct">${opt[1]}</div>
        </div>
      </div>
    `;

    tile.addEventListener('click', () => {
      const wasFlipped = tile.classList.contains('flipped');
      tile.classList.toggle('flipped');
      const nowFlipped = tile.classList.contains('flipped');

      if (!wasFlipped && nowFlipped && !tile.dataset.scored) {
        const pts = parseInt(tile.dataset.pct, 10);
        TEAMS[activeTeam].score += pts;
        tile.dataset.scored = String(activeTeam);
        tile.classList.add('scored-' + activeTeam);
        const back = tile.querySelector('.tile-back');
        const tag = document.createElement('div');
        tag.className = 'won-tag';
        tag.textContent = TEAMS[activeTeam].name;
        back.appendChild(tag);
        renderTeams();
      }
      updateProgress(qi);
    });

    tiles.appendChild(tile);
  });

  card.appendChild(tiles);

  const progressRow = document.createElement('div');
  progressRow.className = 'progress-row';
  progressRow.innerHTML = `
    <span class="progress-label">Reveladas</span>
    <div class="progress-bar"><div class="progress-fill" id="fill-${qi}"></div></div>
    <span class="progress-total" id="total-${qi}">0</span>
  `;
  card.appendChild(progressRow);

  board.appendChild(card);
});

function updateProgress(qi) {
  const tiles = document.querySelectorAll(`.tile[data-q="${qi}"]`);
  let total = 0;
  tiles.forEach(t => {
    if (t.classList.contains('flipped')) total += parseInt(t.dataset.pct, 10);
  });
  document.getElementById(`fill-${qi}`).style.width = Math.min(total,100) + '%';
  document.getElementById(`total-${qi}`).textContent = total;
}

function addStrike(qi) {
  for (let i = 0; i < 3; i++) {
    const dot = document.getElementById(`strike-${qi}-${i}`);
    if (!dot.classList.contains('on')) {
      dot.classList.add('on');
      dot.textContent = '✕';
      break;
    }
  }
}

function resetStrikes(qi) {
  for (let i = 0; i < 3; i++) {
    const dot = document.getElementById(`strike-${qi}-${i}`);
    dot.classList.remove('on');
    dot.textContent = '';
  }
}

function revealAllReview() {
  document.querySelectorAll('.tile').forEach(t => t.classList.add('flipped'));
  DATA.forEach((_, qi) => updateProgress(qi));
}

function hideAll() {
  document.querySelectorAll('.tile').forEach(t => t.classList.remove('flipped'));
  DATA.forEach((_, qi) => updateProgress(qi));
}
</script>
